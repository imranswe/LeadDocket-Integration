services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: leaddocket
      POSTGRES_USER: leaddocket
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaddocket -d leaddocket"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8081:8080"
    env_file: .env
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/leaddocket
      DB_USERNAME: leaddocket
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
